# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for unity-plugin. It adds to the organization's central CodeRabbit
# configuration: with inheritance on, lists are combined and a value set here wins over the
# central one. Keep here only what is specific to this repository.
#
# Which copy of this file a review reads: for a pull request from a branch of this repository,
# opened by an organization member or a collaborator with write access, the one on the pull
# request branch; for any other pull request, forks included, the one on its base commit. A
# branch created before a change picks it up once it includes that change.
#
# To see the settings in force and where each comes from, comment
# "@coderabbitai configuration" on any pull request.

inheritance: true

reviews:
  profile: assertive
  path_instructions:
    - path: "Packages/com.scenario.unity/**/*.cs"
      instructions: >-
        Unity editor plugin. Beyond the editor plugin rules in the baseline: OAuth and credential
        calls must not follow redirects; the spending switch and price must be rechecked after a
        token refresh; no synchronous network or file work on the editor main thread; EditorPrefs or
        file storage of secrets must survive domain reloads without leaking into version control.
        Unity .meta files are excluded from review by the baseline.
