# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Scenario: CodeRabbit configuration for scenario-labs/unity-plugin
# Prepared by Chris Hester, CodeRabbit, Thursday November 19th 2026, after the November 18th call.
#
# Commit this file as .coderabbit.yaml at the root of the default branch of unity-plugin. It starts with
# "inheritance: true", so everything in the organization baseline (the .coderabbit.yaml in the
# scenario-labs/coderabbit repository) applies here too: lists such as path instructions, checks
# and file filters are combined, and the single values set below win over the baseline. This file
# therefore holds only what is specific to unity-plugin: the Unity editor plugin.
#
# Pull requests opened by organization members read this file from their own branch, so a branch
# cut before the commit picks it up once it is updated from the default branch; pull requests from
# outside collaborators read it from the target branch at once.
# Kept from your dashboard for this repository: assertive profile, review details.
# Verify with the comment "@coderabbitai configuration" on any open pull request.

inheritance: true

reviews:
  profile: assertive   # kept from your dashboard
  path_instructions:
    - path: "Packages/com.scenario.unity/**/*.cs"
      instructions: >-
        Unity editor plugin. Beyond the editor plugin rules in the baseline: OAuth and credential
        calls must not follow redirects; the spending switch and price must be rechecked after a
        token refresh; no synchronous network or file work on the editor main thread; EditorPrefs or
        file storage of secrets must survive domain reloads without leaking into version control.
        Unity .meta files are excluded from review by the baseline.

knowledge_base:
  linked_repositories:
  - repository: scenario-labs/scenario-auth
    instructions: >-
      Shared sign-in service for integrations (auth.scenario.com, on Clerk). Check its OAuth
      endpoints, scopes and token rules before flagging a sign-in or token flow here.
  - repository: scenario-labs/phoenix
    instructions: >-
      The Scenario API this plugin calls directly. Check endpoints, payloads and errors there
      before flagging a request here.
