name: release-please

# Keeps a release PR open on main. Merging it drafts the unity-plugin-vX.Y.Z
# release; the assets job builds the UPM tarball com.scenario.unity-X.Y.Z.tgz
# from the release commit, checks it, attests it and attaches it with
# SHA256SUMS to the draft; the publish job then publishes the draft, which
# creates the tag users install through the git URL. Same flow as
# blender-plugin and photoshop-plugin, with a tarball for their zip and .ccx.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Forks have neither the App credentials nor anything to release.
    if: github.repository == 'scenario-labs/unity-plugin'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.pending.outputs.found == 'true' || steps.release-please.outputs.release_created == 'true' }}
      tag_name: ${{ steps.pending.outputs.tag_name || steps.release-please.outputs.tag_name }}
      sha: ${{ steps.pending.outputs.sha || steps.release-please.outputs.sha }}
    steps:
      # The release PR, release commit and release are created with a GitHub App
      # token, not GITHUB_TOKEN: GitHub never starts a workflow from an event
      # created by GITHUB_TOKEN, so the release PR would never run the CI the
      # main rulesets require, and the versioning ruleset lets only the App
      # create release tags.
      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      # A draft left by a failed run is published by rerunning that run, never
      # by a newer push: its tag would otherwise point at the wrong commit.
      - name: Find an unfinished draft before creating another release
        id: pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          drafts="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.draft == true and (.tag_name | startswith("unity-plugin-v")))]' | jq -s 'add // []')"
          count="$(jq length <<<"$drafts")"
          if [ "$count" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple Unity release drafts exist; resolve them before retrying"
            exit 1
          fi
          tag="$(jq -r '.[0].tag_name' <<<"$drafts")"
          sha="$(jq -r '.[0].target_commitish' <<<"$drafts" | tr 'A-F' 'a-f')"
          if ! [[ "$tag" =~ ^unity-plugin-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
              || ! jq -e '.[0].prerelease == false' <<<"$drafts" > /dev/null; then
            echo "::error::The pending draft must have a stable unity-plugin-vX.Y.Z tag"
            exit 1
          fi
          jq -e '.[0].author.login == "gh-actions-token-retriever-public[bot]"' <<<"$drafts" > /dev/null \
            || { echo "::error::The pending draft was not created by the release GitHub App"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::The pending draft must target a full commit SHA, not a branch"; exit 1; }
          [ "$sha" = "$GITHUB_SHA" ] \
            || { echo "::error::Rerun the original release workflow for $sha; newer pushes must not publish this draft"; exit 1; }
          { echo "found=true"; echo "tag_name=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.pending.outputs.found != 'true'
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # The release is created as a draft, so its tag does not exist yet: the
  # tarball is built from the release commit, checked, checksummed, attested
  # and attached to the draft, and only the publish job below flips it, which
  # is what creates the tag.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Package version must equal the tag
        run: |
          set -euo pipefail
          # The provenance action records the triggering SHA from signed OIDC
          # claims. Recover by rerunning the original release workflow only.
          [ "$RELEASE_SHA" = "$GITHUB_SHA" ] || { echo "::error::Re-run the original release workflow so provenance matches the release commit"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::Checkout does not match the release commit"; exit 1; }
          V="$(jq -r .version Packages/com.scenario.unity/package.json)"
          [ "unity-plugin-v$V" = "$TAG" ] || { echo "::error::package version $V does not match $TAG"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # Node's built-in modules only: no npm install runs here. The check
      # compares the tarball with the release commit's package, file by file,
      # and reads the version from the tarball's own package.json.
      - name: Build the tarball, check it, then checksum
        run: |
          set -euo pipefail
          node tools/release/build-package.js --out dist
          node tools/release/check-package.js "dist/com.scenario.unity-${VERSION}.tgz" "$VERSION"
          (cd dist && sha256sum "com.scenario.unity-${VERSION}.tgz" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/com.scenario.unity-${{ env.VERSION }}.tgz
            dist/SHA256SUMS

      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      # The attestation's Sigstore bundle lets anyone verify the files without
      # GitHub's attestation API; OpenSSF Scorecard counts it as a signature.
      - name: Attach the tarball, SHA256SUMS and provenance bundle to the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          RELEASE="$(gh release view "$TAG" --json isDraft,targetCommitish)"
          jq -e --arg sha "$RELEASE_SHA" '.isDraft and .targetCommitish == $sha' <<<"$RELEASE" > /dev/null
          cp "$BUNDLE" "dist/com.scenario.unity-${VERSION}.sigstore.json"
          gh release upload "$TAG" "dist/com.scenario.unity-${VERSION}.tgz" dist/SHA256SUMS "dist/com.scenario.unity-${VERSION}.sigstore.json" --clobber

  # Publishing the draft creates the tag (the versioning ruleset admits the App
  # as a bypass actor). Nothing may change after this once immutable releases
  # are on.
  publish:
    needs: [release-please, assets]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Package version must equal the tag
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] || { echo "::error::Checkout does not match the release commit"; exit 1; }
          V="$(jq -r .version Packages/com.scenario.unity/package.json)"
          [ "unity-plugin-v$V" = "$TAG" ] || { echo "::error::package version $V does not match $TAG"; exit 1; }

      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      - name: Publish the draft (creates the tag)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${TAG#unity-plugin-v}"
          RELEASE="$(gh release view "$TAG" --json isDraft,targetCommitish,assets)"
          jq -e --arg sha "$RELEASE_SHA" --arg tgz "com.scenario.unity-$V.tgz" --arg bundle "com.scenario.unity-$V.sigstore.json" '
            .isDraft and .targetCommitish == $sha and
            any(.assets[]; .name == "SHA256SUMS") and
            any(.assets[]; .name == $tgz) and
            any(.assets[]; .name == $bundle)
          ' <<<"$RELEASE" > /dev/null
          gh release edit "$TAG" --draft=false

  # Untagged drafts are invisible to release-please's commit-boundary discovery.
  # Generate the next PR only after publication, or when there was no draft.
  release-pr:
    needs: [release-please, publish]
    if: >-
      ${{ !cancelled() && needs.release-please.result == 'success' &&
          (needs.publish.result == 'success' ||
           (needs.publish.result == 'skipped' && needs.release-please.outputs.release_created != 'true')) }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Retrieve GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_CLIENT_ID }}
          private-key: ${{ secrets.GH_ACTIONS_TOKEN_RETRIEVER_PUBLIC_REPO_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
